<article class="recipe-card rounded-10 gray-border card-shadow">
  <picture>
    <source srcset="{{ recipe?.image?.large }}" media="min-width: 1024px;" />
    <img src="{{ recipe?.image?.small }}" alt="" class="recipe-card__image rounded-10" />
  </picture>
  <div class="recipe-card__text">
    <h2 class="recipe-card__text-title">{{ recipe?.title }}</h2>
    <p>{{ recipe?.overview }}</p>
    <div class="recipe-card__prep-details">
      <span>
        <img
          class="icon"
          src="assets/images/icon-servings.svg"
          alt=""
        />Servings: {{ recipe?.servings }}
      </span>
      <span>
        <img class="icon" src="assets/images/icon-prep-time.svg" alt="" />Prep:
        {{ recipe?.prepMinutes + " mins" }}
      </span>
      <span>
        <img class="icon" src="assets/images/icon-cook-time.svg" alt="" />Cook:
        {{ recipe?.cookMinutes + " min" }}
      </span>
    </div>
  </div>
  <a (click)="navigate(recipe?.id)" class="recipe-card__link main-btn rounded-full">View Recipe</a>
</article>
